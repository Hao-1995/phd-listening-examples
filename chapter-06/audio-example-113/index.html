<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <title>Audio Example 113 | PhD Thesis Supplementary Material</title>
  <style>
:root {
  color-scheme: light;
  --ink: #242424;
  --muted: #626262;
  --rule: #e2e2df;
  --paper: #ffffff;
  --canvas: #f6f6f4;
  --accent: #ae2235;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  padding: 40px 22px 50px;
  background: var(--canvas);
  color: var(--ink);
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 820px; margin: 0 auto; }
.document { background: var(--paper); border: 1px solid var(--rule); padding: 35px 43px 30px; }
.excerpt-header { margin-bottom: 21px; }
h1 { font-size: 1.38rem; line-height: 1.34; font-weight: 500; letter-spacing: -0.012em; margin: 0; }
.work { color: #343434; font-size: 1.02rem; margin: 0 0 3px; }
.recording { margin: 0 0 13px; color: #555; font-size: 0.94rem; font-variant-numeric: tabular-nums; }
.excerpt-block { scroll-margin-top: 18px; }
.excerpt-block + .excerpt-block { border-top: 1px solid var(--rule); margin-top: 23px; padding-top: 21px; }
.audio-block { width: 100%; }
audio { width: min(440px, 100%); display: block; height: 44px; }
.player-controls {
  display: flex;
  width: min(440px, 100%);
  min-height: 44px;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border: 1px solid #e4e5e5;
  border-radius: 23px;
  background: #f1f3f4;
  color: #292a2d;
  font-family: Arial, Helvetica, sans-serif;
}
.player-btn {
  flex: 0 0 33px;
  width: 33px;
  height: 33px;
  padding: 6px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: currentColor;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.player-btn:hover { background: #e0e3e5; }
.player-btn:focus-visible, .seek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.player-btn svg { width: 18px; height: 18px; fill: currentColor; }
.clock { flex: 0 0 auto; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.seek { flex: 1 1 auto; min-width: 28px; width: 100%; margin: 0; height: 20px; accent-color: #55595d; cursor: pointer; }
.playback-error { margin: 7px 0 0; color: #a3292b; font-size: .85rem; }
footer { margin: 26px 0 0; color: #747474; font-family: Arial, Helvetica, sans-serif; font-size: 0.74rem; line-height: 1.6; }
footer p { margin: 0; }
footer p + p { margin-top: 5px; }
@media (max-width: 800px) {
  body { padding: 18px 12px 28px; }
  .document { padding: 26px 23px; }
  h1 { font-size: 1.24rem; }
}
@media (max-width: 440px) {
  .document { padding: 23px 17px; }
  .player-controls { gap: 7px; padding: 4px 7px; }
  .player-btn { flex-basis: 30px; width: 30px; height: 30px; }
  .clock { font-size: .73rem; }
  .work { font-size: .98rem; }
  .recording { font-size: .9rem; }
}
@media print {
  body { background: #fff; padding: 0; }
  .document { border: 0; padding: 0; }
  .audio-block { display: none; }
}

  </style>
</head>
<body data-allow-window="false">
  <main>
    <article class="document">
      <header class="excerpt-header"><h1>Audio Example 113</h1></header>
      
      <section class="excerpt-block" id="segment-01" aria-label="Pale on the ground, original recording 2:50–3:10">
  <p class="work">Juliet Palmer, <em>Pale on the ground</em></p>
  <p class="recording">Original recording: <span class="recording-time">2:50–3:10</span></p>
  <div class="audio-block" data-player data-audio="../audio-resources/pale-on-the-ground-02m42s-04m10s.mp3" data-base-start="162" data-base-end="250" data-from="170" data-to="190">
    <audio controls preload="metadata" src="../audio-resources/pale-on-the-ground-02m42s-04m10s.mp3#t=8,28" aria-label="Pale on the ground, original recording 2:50–3:10">Your browser does not support HTML5 audio.</audio>
    <div class="player-controls" hidden role="group" aria-label="Audio playback">
      <button type="button" class="player-btn play-toggle" aria-label="Play excerpt" title="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5v17l14-8.5z"/></svg></button>
      <span class="clock">0:00 / 0:20</span>
      <input class="seek" type="range" min="0" max="20" step="0.1" value="0" aria-label="Playback position">
      <button type="button" class="player-btn mute-toggle" aria-label="Mute excerpt" aria-pressed="false" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/></svg></button>
    </div>
    <p class="playback-error" role="status" hidden>Audio could not be played. Please check the audio file and try again.</p>
  </div>
</section>
      <footer>Research supplementary material. Audio and notation copyrights remain with their respective rights holders.</footer>
    </article>
  </main>
  <script>
(function () {
  'use strict';
  const roots = Array.from(document.querySelectorAll('[data-player]'));
  const audioElements = roots.map(root => root.querySelector('audio'));
  const parameterWindow = new URLSearchParams(window.location.search);
  const formatTime = value => {
    const seconds = Math.max(0, Math.floor(value + 0.001));
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  };
  const icons = {
    play: '<path d="M6.5 3.5v17l14-8.5z"/>',
    pause: '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>',
    volume: '<path d="M3 9v6h4l5 4V5L7 9H3zm12.5-1.7a6 6 0 0 1 0 9.4l-1.3-1.5a4 4 0 0 0 0-6.4l1.3-1.5zm2.8-3a10 10 0 0 1 0 15.4l-1.4-1.4a8 8 0 0 0 0-12.6l1.4-1.4z"/>',
    muted: '<path d="M3 9v6h4l5 4V5L7 9H3zm12.1 0 1.4-1.4 2.4 2.4 2.4-2.4 1.4 1.4-2.4 2.4 2.4 2.4-1.4 1.4-2.4-2.4-2.4 2.4-1.4-1.4 2.4-2.4z"/>'
  };
  function setIcon(button, name) { button.querySelector('svg').innerHTML = icons[name]; }

  roots.forEach((root, index) => {
    const audio = root.querySelector('audio');
    const controls = root.querySelector('.player-controls');
    const play = root.querySelector('.play-toggle');
    const mute = root.querySelector('.mute-toggle');
    const seek = root.querySelector('.seek');
    const clock = root.querySelector('.clock');
    const error = root.querySelector('.playback-error');
    const block = root.closest('.excerpt-block');
    const label = block.querySelector('.recording-time');
    const baseStart = Number(root.dataset.baseStart);
    const baseEnd = Number(root.dataset.baseEnd);
    let from = Number(root.dataset.from);
    let to = Number(root.dataset.to);
    if (document.body.dataset.allowWindow === 'true' && roots.length === 1 && parameterWindow.has('from') && parameterWindow.has('to')) {
      const requestedFrom = Number(parameterWindow.get('from'));
      const requestedTo = Number(parameterWindow.get('to'));
      if (Number.isSafeInteger(requestedFrom) && Number.isSafeInteger(requestedTo) &&
          requestedFrom >= baseStart && requestedTo <= baseEnd && requestedTo > requestedFrom) {
        from = requestedFrom;
        to = requestedTo;
      }
    }
    const start = from - baseStart;
    const end = to - baseStart;
    const length = to - from;
    root.dataset.selectedFrom = String(from);
    root.dataset.selectedTo = String(to);
    root.dataset.relativeStart = String(start);
    root.dataset.relativeEnd = String(end);
    label.textContent = `${formatTime(from)}–${formatTime(to)}`;
    const mediaSrc = `${root.dataset.audio}#t=${start},${end}`;
    if (audio.getAttribute('src') !== mediaSrc) audio.setAttribute('src', mediaSrc);
    seek.max = String(length);
    seek.value = '0';
    clock.textContent = `0:00 / ${formatTime(length)}`;
    audio.controls = false;
    audio.hidden = true;
    controls.hidden = false;
    let atEnd = false;
    let timer = null;
    let ready = false;

    function seekTo(time) {
      const absolute = Math.min(end, Math.max(start, time));
      try { audio.currentTime = absolute; } catch (_) { /* seek after metadata */ }
    }
    function markEnd() {
      atEnd = true;
      if (!audio.paused) audio.pause();
      seek.value = String(length);
      clock.textContent = `${formatTime(length)} / ${formatTime(length)}`;
    }
    function render() {
      const playing = !audio.paused && !audio.ended && !atEnd;
      setIcon(play, playing ? 'pause' : 'play');
      play.setAttribute('aria-label', playing ? 'Pause excerpt' : 'Play excerpt');
      play.title = playing ? 'Pause' : 'Play';
      const value = atEnd ? length : Math.min(length, Math.max(0, audio.currentTime - start));
      seek.value = String(value);
      seek.setAttribute('aria-valuetext', `${formatTime(value)} of ${formatTime(length)}`);
      clock.textContent = `${formatTime(value)} / ${formatTime(length)}`;
      setIcon(mute, audio.muted ? 'muted' : 'volume');
      mute.setAttribute('aria-label', audio.muted ? 'Unmute excerpt' : 'Mute excerpt');
      mute.setAttribute('aria-pressed', String(audio.muted));
      mute.title = audio.muted ? 'Unmute' : 'Mute';
    }
    function tick() {
      // The media fragment also asks the browser to stop at the endpoint.
      // This check keeps the interface and timeline bounded to the selection.
      if (!audio.paused && audio.currentTime + 0.02 >= end) markEnd();
      render();
    }
    function initializePosition() {
      if (ready) return;
      ready = true;
      seekTo(start);
      render();
    }
    audio.addEventListener('loadedmetadata', initializePosition);
    if (audio.readyState >= 1) initializePosition();
    audio.addEventListener('timeupdate', tick);
    audio.addEventListener('play', () => {
      audioElements.forEach((other, i) => { if (i !== index && !other.paused) other.pause(); });
      if (timer !== null) clearInterval(timer);
      timer = setInterval(tick, 35);
      render();
    });
    audio.addEventListener('pause', () => {
      if (timer !== null) clearInterval(timer);
      timer = null;
      if (audio.currentTime + 0.06 >= end) atEnd = true;
      render();
    });
    audio.addEventListener('ended', markEnd);
    audio.addEventListener('seeked', render);
    audio.addEventListener('volumechange', render);
    audio.addEventListener('error', () => { error.hidden = false; });
    play.addEventListener('click', () => {
      if (!audio.paused) { audio.pause(); return; }
      error.hidden = true;
      if (atEnd || audio.currentTime < start - 0.02 || audio.currentTime >= end - 0.02) {
        atEnd = false;
        seekTo(start);
      }
      audio.play().catch(() => { error.hidden = false; render(); });
    });
    seek.addEventListener('input', () => {
      const value = Number(seek.value);
      atEnd = value >= length;
      if (atEnd) audio.pause();
      seekTo(start + value);
      render();
    });
    mute.addEventListener('click', () => { audio.muted = !audio.muted; render(); });
    render();
  });
}());

  </script>
</body>
</html>
